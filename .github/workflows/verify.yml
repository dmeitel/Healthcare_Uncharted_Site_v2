# Two jobs, one file.
#
# verify: runs the same gate a session runs by hand (build, types, tests) on every push, so a
# red X in David's inbox is the first time anyone hears a push broke the site, instead of the
# next session finding it.
#
# keep-awake: the multiplayer backend is a free Supabase project, and free projects pause after
# a week without a request. It paused on 2026-09-13 and nobody noticed until 2026-09-20. Every
# day this job makes one request to it. The host and the publishable key are read from
# the game page itself, so there is nothing to configure in GitHub and nothing secret involved
# (the publishable key ships inside the page by design).
#
# It paused AGAIN on 2026-10-01 while this job was passing. Supabase counts "user queries" to
# the database (supabase.com/docs/guides/platform/free-project-pausing, checked 2026-10-02), and
# the games only use Realtime, which is not a database query. This job used to read a table that
# did not exist and accept the 404, but PostgREST answers that from its schema cache without
# running a query, so it proved the project was up without keeping it up. Now it reads the real
# one-row `keepalive` table, accepts only 200, and runs daily (the docs ask for a few queries a
# day). A 404 means the table is missing: create it with the SQL in DECISIONS.md (2026-10-02).

# ACTIONS ARE PINNED to the exact commit of a release (2026-10-11, the Ideas card on GitHub protections): a tag
# like v4 can be moved to new code by whoever controls it; a commit cannot. The comment names the release. To
# upgrade, look up the new release commit and change both.

name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  keep-awake:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: One request to the multiplayer backend
        run: |
          PAGE=src/secret-menu/uncharted-general/index.html
          URL=$(grep -o "const SUPA = { url:'[^']*'" "$PAGE" | sed "s/.*url:'//; s/'$//")
          KEY=$(grep -o "anonKey:'[^']*'" "$PAGE" | head -1 | sed "s/anonKey:'//; s/'$//")
          echo "pinging $URL"
          # A real table read, so the database runs a query and Supabase counts the project as in
          # use. A paused project has no DNS at all (curl reports 000), one still starting answers
          # 521 from Cloudflare, and a 404 means the keepalive table is missing, which keeps
          # nothing awake. Only 200 passes.
          code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "$URL/rest/v1/keepalive?select=id")
          echo "backend answered $code"
          case "$code" in
            200) exit 0 ;;
            404) echo "the keepalive table is missing, so this request ran no query and the project can still pause"; exit 1 ;;
            *) echo "the backend did not answer like a running project; it may have paused"; exit 1 ;;
          esac
