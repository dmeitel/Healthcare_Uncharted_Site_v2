        - generic [ref=f13e96]:
          - paragraph [ref=f13e97]: Chrysalis Ashton is a respiratory therapist with 13 years of experience and a dedicated advocate for the post-acute care profession. After beginning her career in acute care, she found her passion for home care and DME, where she has served in several roles including Clinical Director and Compliance Officer.
          - paragraph [ref=f13e98]: Chrysalis actively advances the respiratory profession by coordinating partnerships with RT education programs, mentoring future clinicians, and volunteering as an AARC Delegate and home care chair-elect for her state respiratory society. She is a graduate of the AARC’s inaugural Emerging Leaders Program (2024), a COPD Foundation State Captain, and participates in several AAHomecare committees and work groups.
