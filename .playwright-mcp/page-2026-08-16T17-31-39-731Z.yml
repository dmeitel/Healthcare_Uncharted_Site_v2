      - generic [ref=f13e37]:
        - heading "About Healthcare Uncharted" [level=2] [ref=f13e38]
        - generic [ref=f13e39]:
          - generic [ref=f13e40]: Mission
          - generic [ref=f13e41]: "\"Healthcare runs on clinical, financial, operational, and policy layers that rarely share a page. Healthcare Uncharted puts them on one chart and draws the lines between them, for anyone whose job depends on seeing the whole thing.\""
        - paragraph [ref=f13e42]: Healthcare technology is full of territory that nobody maps end-to-end. A clinician charts in an enterprise EHR every shift and is never told why the data is shaped the way it is. The analyst downstream writes SQL against those same tables without the clinical meaning. And the leadership team? They are signing AI contracts with no reliable way to tell what works from what is still a demo.
        - paragraph [ref=f13e43]:
          - strong [ref=f13e44]: Healthcare Uncharted is the system map I wish had existed when I started in healthcare informatics.
          - text: It is built from real clinical bedside experience, real health administration, and real work with EHR data systems. Not vendor training materials or theoretical frameworks.
        - paragraph [ref=f13e45]: "The goal is simple: chart how the pieces connect, and write it so any seat in the hospital can use it."
        - heading "About David Eitel" [level=2] [ref=f13e46]
        - paragraph [ref=f13e47]:
          - text: "I started my career as a Registered Respiratory Therapist in the ICU: bedside care, mechanical ventilation, hemodynamic monitoring, and all the documentation that goes with it. That experience gave me something rare in informatics: I know what the data"
          - emphasis [ref=f13e48]: means
          - text: at the bedside, and I know how it lives in the tables. Most people in this field get one or the other.
        - paragraph [ref=f13e49]: From there I moved through health administration and into clinical informatics. That’s the operational layer where clinical care, data architecture, and health system management intersect. That path is what makes this map possible.
