            - generic [ref=f4e698]: Overview
            - generic [ref=f4e699]:
              - paragraph [ref=f4e700]: The MICU handles what the floor can't contain. Septic shock requiring vasopressors. Respiratory failure requiring mechanical ventilation. Acute liver failure. Diabetic ketoacidosis that won't close. The patients here are being kept alive by a combination of nursing vigilance, technology, and pharmacology running simultaneously, around the clock.
              - paragraph [ref=f4e701]: Nursing in the MICU is 1:2 at best. Every assessment takes longer. Every intervention requires more documentation. The acuity demands that nurses integrate continuous vital sign data, ventilator parameters, medication drips, and clinical trajectory into a coherent picture, and communicate that picture clearly at every handoff.
